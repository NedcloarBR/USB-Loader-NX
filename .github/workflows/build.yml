name: Build

# Only when something that goes into the build or the zip changed; the Release workflow always builds (workflow_call).
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'common/**'
      - 'manager/**'
      - 'atmosphere'
      - 'config_templates/**'
      - 'docker/**'
      - 'tools/**'
      - 'usbl.mk'
      - 'ATMOSPHERE_VERSION'
      - 'scripts/build.sh'
      - 'scripts/build-image.sh'
      - 'scripts/package.sh'
      - '.github/workflows/build.yml'
      - '!**/*.md'
      - 'packaging/**'
  pull_request:
    paths:
      - 'src/**'
      - 'common/**'
      - 'manager/**'
      - 'atmosphere'
      - 'config_templates/**'
      - 'docker/**'
      - 'tools/**'
      - 'usbl.mk'
      - 'ATMOSPHERE_VERSION'
      - 'scripts/build.sh'
      - 'scripts/build-image.sh'
      - 'scripts/package.sh'
      - '.github/workflows/build.yml'
      - '!**/*.md'
      - 'packaging/**'
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # atmosphere/ is this repository's "atmosphere" branch (relative submodule URL); manager/lib/Plutonium is public.
          submodules: recursive
          fetch-depth: 0

      # The images only change with their Dockerfiles (pinned base image and libnx revision), so a saved copy skips
      # their 4 minutes and pkg.devkitpro.org, which sometimes answers runners with 403. Tags and pull requests read
      # the copy saved on master.
      - name: Restore the build images
        id: images
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/images.tar.zst
          key: build-images-${{ hashFiles('atmosphere/Dockerfile', 'docker/Dockerfile', 'scripts/build-image.sh') }}

      - name: Load the build images
        if: steps.images.outputs.cache-hit == 'true'
        run: zstd -dc "$RUNNER_TEMP/images.tar.zst" | docker load

      # Plain docker build, as on the PC: the second image starts FROM the first, which buildx's isolated builder
      # would look for on Docker Hub instead.
      - name: Build images (Atmosphère's Dockerfile, + libnx from git)
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          scripts/build-image.sh
          docker save atms-build-libnx | zstd -T0 -3 -q -o "$RUNNER_TEMP/images.tar.zst"

      - name: Build
        env:
          USBL_VERSION: ${{ inputs.version || format('dev-{0}', github.sha) }}
        run: |
          scripts/build.sh
          scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: usb-loader-nx
          path: dist/*.zip
          retention-days: ${{ inputs.version && 1 || 7 }}
