name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # atmosphere/ is this repository's "atmosphere" branch (relative submodule URL); manager/lib/Plutonium is public.
          submodules: recursive
          fetch-depth: 0

      # Plain docker build, as on the PC: the second image starts FROM the first, which buildx's isolated builder
      # would look for on Docker Hub instead.
      - name: Build images (Atmosphère's Dockerfile, + libnx from git)
        run: scripts/build-image.sh

      - name: Build
        env:
          USBL_VERSION: ${{ inputs.version || format('dev-{0}', github.sha) }}
        run: |
          scripts/build.sh
          scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: usb-loader-nx
          path: dist/*.zip
          retention-days: ${{ inputs.version && 1 || 7 }}
