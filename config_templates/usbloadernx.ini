; Copy to /usbloadernx/config.ini to change these before the first boot.
; USB Loader NX creates that file with these defaults when it is missing; the Manager edits it.
; [format] says which version of USB Loader NX wrote the file (FORMATS.md); leave it as it is.
[format]
version = 1

[usbloadernx]
; Controls whether games found on USB are registered in the SD card ncm database and in ns, so they show up on HOME.
; NOTE: This writes to the SD card content meta database and to the ns application records.
; 0 = Disabled, 1 = Enabled
; auto_register = 1
; Controls whether USB Loader NX posts Ultrahand notifications when a drive is connected or removed.
; Only takes effect when Ultrahand is installed.
; 0 = Disabled, 1 = Enabled
; notifications = 1
; Controls whether USB Loader NX draws a USB + game card badge on the icons of games served from USB.
; 0 = Disabled, 1 = Enabled
; badge = 1
; Controls whether games served from USB disappear from the HOME menu while their drive is unplugged.
; NOTE: Removes and re-adds their ns application records; when shown again the icon moves to the front.
; 0 = Disabled, 1 = Enabled
; hide_when_removed = 0
